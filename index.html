<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đang tải file con chuột...</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 50px;
            background-color: #f4f4f9;
        }
        .box {
            background: white;
            padding: 30px;
            border-radius: 10px;
            display: inline-block;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.1);
        }
        a {
            color: #007bff;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="box">
        <h2>File con chuột của bạn đang được tải xuống...</h2>
        <p>Nếu quá trình tải không tự động bắt đầu, hãy <a id="download-link" href="chuot.zip" download>bấm vào đây để tải thủ công</a>.</p>
    </div>

    <script>
        // Tự động kích hoạt hành động tải xuống ngay khi trang load xong
        window.onload = function() {
            var link = document.getElementById('download-link');
            
            // Tạo một thẻ <a> ngầm để kích hoạt tải tự động
            var a = document.createElement('a');
            a.href = link.href;
            a.download = 'chuot.zip'; // Tên file khi tải về máy người dùng
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        };
    </script>

</body>
</html>
