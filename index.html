<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đang tải con trỏ chuột Windows 11 Concept...</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 50px;
            background-color: #f4f4f9;
        }
        .box {
            background: white;
            padding: 30px;
            border-radius: 10px;
            display: inline-block;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.1);
        }
        a {
            color: #007bff;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="box">
        <h2>File con trỏ chuột Windows 11 Concept đang được tự động tải xuống...</h2>
        <p>Nếu quá trình tải không bắt đầu, hãy <a id="download-link" href="windows_11_cursors_concept_by_jepricreations_densjkc.zip" download>bấm vào đây để tải trực tiếp</a>.</p>
    </div>

    <script>
        window.onload = function() {
            var link = document.getElementById('download-link');
            
            // Kích hoạt tự động tải file zip
            var a = document.createElement('a');
            a.href = link.getAttribute('href');
            a.download = link.getAttribute('href');
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        };
    </script>

</body>
</html>
